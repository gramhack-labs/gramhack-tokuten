<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIツールの選び方診断</title>
<style>
  :root {
    --paper: #fffaf6;
    --ink: #34172f;
    --ink-soft: #7a5a71;
    --line: #f1d9e4;
    --pink: #ff59a0;
    --magenta: #d81e8f;
    --sky: #2fb8e0;
    --pink-pale: #fce5ed;
    --card: #ffffff;
    --grad: linear-gradient(90deg, var(--pink) 0%, var(--magenta) 52%, var(--sky) 100%);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    overflow-x: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    font-weight: 700;
    text-wrap: balance;
    margin: 0;
    color: var(--ink);
  }

  .page {
    position: relative;
    padding: 48px 20px 64px;
  }

  .deco {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
    opacity: 0.3;
  }
  .deco-a {
    width: 340px;
    height: 340px;
    top: -160px;
    left: -140px;
    background: radial-gradient(circle at 30% 30%, var(--sky), transparent 70%);
  }
  .deco-b {
    width: 300px;
    height: 300px;
    bottom: -140px;
    right: -120px;
    background: radial-gradient(circle at 70% 70%, var(--pink), transparent 70%);
  }
  .deco-arc {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 96px;
    height: 96px;
    opacity: 0.5;
    pointer-events: none;
  }

  .stage {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 18px 48px -24px rgba(52, 23, 47, 0.28);
    padding: 40px clamp(20px, 5vw, 44px) 44px;
  }

  .screen { display: flex; flex-direction: column; gap: 18px; }
  .screen[hidden] { display: none; }

  .eyebrow {
    display: inline-flex;
    align-self: flex-start;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--pink-pale);
    color: var(--magenta);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin: 0;
  }

  h1 { font-size: clamp(26px, 6vw, 32px); }

  .subtitle {
    color: var(--magenta);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    font-weight: 700;
    font-size: 14px;
    margin: -6px 0 0;
    word-break: keep-all;
  }

  .lead {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0;
    max-width: 46ch;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .promise {
    list-style: none;
    margin: 4px 0 0;
    padding: 16px 18px;
    background: var(--pink-pale);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    color: var(--ink);
  }
  .promise strong { color: var(--magenta); font-variant-numeric: tabular-nums; }

  .btn-primary {
    appearance: none;
    border: none;
    cursor: pointer;
    margin-top: 8px;
    padding: 16px 24px;
    border-radius: 999px;
    background: var(--grad);
    color: #fff;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
    box-shadow: 0 12px 24px -12px rgba(216, 30, 143, 0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 16px 28px -12px rgba(216, 30, 143, 0.6); }
  .btn-primary:focus-visible {
    outline: 3px solid var(--sky);
    outline-offset: 3px;
  }

  .btn-secondary {
    appearance: none;
    cursor: pointer;
    margin-top: 4px;
    padding: 12px 22px;
    border-radius: 999px;
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 14px;
  }
  .btn-secondary:hover { border-color: var(--magenta); color: var(--magenta); }
  .btn-secondary:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress-track {
    height: 8px;
    border-radius: 999px;
    background: var(--pink-pale);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--grad);
    transition: width 0.35s ease;
  }
  .progress-label {
    margin: 0;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .q-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--magenta);
    letter-spacing: 0.08em;
    margin: 0 0 2px;
  }
  .q-text {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 19px;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .option {
    appearance: none;
    text-align: left;
    cursor: pointer;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.6;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: var(--pink); background: #fff; }
  .option:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .result-badge {
    align-self: flex-start;
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--grad);
    color: #fff;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .result-name { font-size: clamp(24px, 6vw, 30px); margin-top: 2px; }
  .result-tagline { color: var(--magenta); font-weight: 700; font-size: 14px; margin: 0; }
  .result-desc { color: var(--ink); font-size: 14.5px; margin: 0; }

  .next-step {
    background: var(--pink-pale);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .next-step h2 {
    font-size: 14px;
    color: var(--magenta);
    letter-spacing: 0.02em;
  }
  .next-step p { margin: 0; font-size: 14px; color: var(--ink); }

  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

  .footnote {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-primary, .progress-fill, .option { transition: none; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
</head>
<body>

<div class="page">
  <div class="deco deco-a" aria-hidden="true"></div>
  <div class="deco deco-b" aria-hidden="true"></div>
  <svg class="deco-arc" viewBox="0 0 96 96" aria-hidden="true">
    <defs>
      <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff59a0" />
        <stop offset="55%" stop-color="#d81e8f" />
        <stop offset="100%" stop-color="#2fb8e0" />
      </linearGradient>
    </defs>
    <path d="M8,88 A80,80 0 0,1 88,8" fill="none" stroke="url(#arcGrad)" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" />
  </svg>

  <main class="stage" id="stage">
    <section class="screen" data-screen="intro" id="screen-intro">
      <p class="eyebrow">個別相談 参加者限定特典</p>
      <h1>AIツールの選び方診断</h1>
      <p class="subtitle">5つの質問で、今のあなたに合うAIツールがわかる</p>
      <p class="lead">ツールの数が多すぎて迷ったら、まずこの診断から。今のやりたいこと・進め方に合わせて、11個のツールの中から1つおすすめします。</p>
      <ul class="promise">
        <li>回答時間の目安 <strong>約1分</strong></li>
        <li>質問数 <strong>全5問</strong>・選択式</li>
        <li>候補は <strong>11ツール</strong> から診断</li>
      </ul>
      <button class="btn-primary" id="start-btn" type="button">診断をはじめる →</button>
    </section>

    <section class="screen" data-screen="quiz" id="screen-quiz" hidden>
      <div class="progress">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <p class="progress-label"><span id="q-index">1</span> / 5　問</p>
      </div>
      <div id="question-mount"></div>
    </section>

    <section class="screen" data-screen="result" id="screen-result" hidden>
      <div id="result-mount"></div>
    </section>
  </main>
</div>

<script>
(function () {
  var questions = [
    {
      text: "今、一番やりたいことに近いのは？",
      options: [
        { label: "文章やアイデアを考える・調べる", tags: { chatgpt: 3, gemini: 3, perplexity: 3 } },
        { label: "画像・スライド・動画などビジュアルを作る", tags: { canva: 3, vrew: 3, genspark: 3 } },
        { label: "情報を整理してまとめる・見返せるようにする", tags: { notion: 3, notebooklm: 3 } },
        { label: "作業を自動化する・任せる仕組みを作る", tags: { manus: 3, dify: 3, claudecode: 3 } }
      ]
    },
    {
      text: "進め方として近いのは？",
      options: [
        { label: "自分の頭の中にあるものを、ゼロから言葉や形にしたい", tags: { chatgpt: 2, canva: 2, manus: 2, claudecode: 2 } },
        { label: "最新のネット情報を調べながら進めたい", tags: { perplexity: 2, gemini: 2 } },
        { label: "すでに持っている資料・データをもとに進めたい", tags: { notebooklm: 2, notion: 2, dify: 2 } },
        { label: "動画・音声など、時間軸のあるものを扱いたい", tags: { vrew: 2, genspark: 2, manus: 2 } }
      ]
    },
    {
      text: "操作のスタイルとして近いのは？",
      options: [
        { label: "チャットで話しかけるだけがいい", tags: { chatgpt: 2, gemini: 2, perplexity: 2 } },
        { label: "テンプレートから選んで作るのがいい", tags: { canva: 2, genspark: 2 } },
        { label: "表やページを作って整理するのが得意", tags: { notion: 2, notebooklm: 2 } },
        { label: "多少複雑でも、仕組みを組み立てるのが好き", tags: { dify: 2, claudecode: 2, manus: 2 } }
      ]
    },
    {
      text: "最終的に欲しいアウトプットは？",
      options: [
        { label: "文章・提案文・アイデアメモ", tags: { chatgpt: 2 } },
        { label: "画像・バナー・スライド", tags: { canva: 2, genspark: 1 } },
        { label: "字幕つきの編集動画", tags: { vrew: 3 } },
        { label: "自動で進む作業の流れ", tags: { manus: 2, dify: 1, claudecode: 1 } }
      ]
    },
    {
      text: "一番重視したいポイントは？",
      options: [
        { label: "とにかく早く形にしたい", tags: { canva: 1, genspark: 1, chatgpt: 1 } },
        { label: "精度・正確な情報がほしい", tags: { perplexity: 2, gemini: 1 } },
        { label: "あとから見返せる、整理された状態にしたい", tags: { notion: 2, notebooklm: 1 } },
        { label: "自分の代わりに作業してほしい", tags: { manus: 2, dify: 1, claudecode: 1 } }
      ]
    }
  ];

  var tools = {
    chatgpt: {
      name: "ChatGPT",
      tagline: "何でも相談できる、頼れる相棒",
      desc: "文章を書く、アイデアを整理する、わからないことを聞く——雑談のように話しかけるだけで、幅広く手伝ってくれる万能型のAIです。",
      next: "まずは「〇〇について、初心者にもわかるように教えて」のように、話しかけるところから始めてみてください。"
    },
    canva: {
      name: "Canva（AI機能つき）",
      tagline: "テンプレートで、デザインを時短する",
      desc: "投稿画像やスライド、バナーなど、見た目のあるものをサクッと形にできるツールです。AIでの画像生成や文章の自動配置もできます。",
      next: "作りたいものに近いテンプレートを探すところから始めると、迷わず形になります。"
    },
    claudecode: {
      name: "Claude Code",
      tagline: "コード・アプリづくりを一緒に進める",
      desc: "プログラミングやツール作りを、会話しながら進められるAIです。自動化の仕組みや、自分専用のアプリを作りたいときに向いています。",
      next: "最初は難しく感じても大丈夫。「〇〇を作りたい、何から始めればいい？」と聞くところからで十分です。"
    },
    gemini: {
      name: "Gemini",
      tagline: "Googleのサービスと相性がいい相棒",
      desc: "Googleドキュメントやスプレッドシートなど、Googleのサービスと連携しやすく、検索結果を踏まえた回答も得意なAIです。",
      next: "普段からGoogleのサービスを使っているなら、まずそこから使い始めるのがスムーズです。"
    },
    notion: {
      name: "Notion（AI機能つき）",
      tagline: "情報を、あとから見返せる形に整理する",
      desc: "メモや資料、タスクをまとめて管理できるツールです。AI機能を使えば、書いた内容の要約や整理も自動でできます。",
      next: "まずは1つのページに、今持っている情報をとりあえず書き出してみるところから始めてください。"
    },
    notebooklm: {
      name: "NotebookLM",
      tagline: "手元の資料を、一緒に読み込んでくれる",
      desc: "自分が持っている資料やPDF、リンクをアップロードすると、その内容だけをもとに質問に答えてくれるAIです。音声解説を作る機能もあります。",
      next: "調べ物や勉強に使っている資料を1つアップロードして、要約させてみるところから始めてみてください。"
    },
    manus: {
      name: "Manus",
      tagline: "作業を、まるごと代わりにやってくれる",
      desc: "やりたいことを伝えると、調べる・作る・まとめるといった複数の作業を自動で進めてくれるAIエージェントです。",
      next: "細かい手順を考えず、まず「これをやってほしい」とゴールだけ伝えてみるのがコツです。"
    },
    perplexity: {
      name: "Perplexity",
      tagline: "根拠つきで、最新情報を調べる",
      desc: "検索エンジンのように使えるAIで、出典つきで答えてくれるのが特徴です。今の情報を正確に知りたいときに向いています。",
      next: "気になることをそのまま質問文で打ち込んで、出典も確認しながら使ってみてください。"
    },
    genspark: {
      name: "Genspark",
      tagline: "スライドやページを、丸ごと作ってくれる",
      desc: "一つのお題から、スライドやまとめページなどの完成品を一気に作ってくれるAIです。ゼロから組み立てる手間を省けます。",
      next: "作りたいものをできるだけ具体的に伝えると、完成度の高いものが返ってきます。"
    },
    dify: {
      name: "Dify",
      tagline: "AIの仕組みを、自分で組み立てる",
      desc: "AIを使った作業の流れ（チャットボットや自動応答など）を、プログラミングなしで組み立てられるツールです。",
      next: "最初は難しく感じるので、用意されているテンプレートから触ってみるのがおすすめです。"
    },
    vrew: {
      name: "Vrew",
      tagline: "字幕づけと動画編集を時短する",
      desc: "話した内容を自動で文字にして、字幕づけやカット編集まで簡単にできる動画編集ツールです。",
      next: "動画をアップロードして、自動で字幕がつくところをまず体験してみてください。"
    }
  };

  var toolOrder = ["chatgpt", "canva", "claudecode", "gemini", "notion", "notebooklm", "manus", "perplexity", "genspark", "dify", "vrew"];

  var state = { index: 0, scores: {} };
  toolOrder.forEach(function (k) { state.scores[k] = 0; });

  var screens = {
    intro: document.getElementById("screen-intro"),
    quiz: document.getElementById("screen-quiz"),
    result: document.getElementById("screen-result")
  };

  function show(name) {
    Object.keys(screens).forEach(function (key) {
      screens[key].hidden = key !== name;
    });
  }

  function renderQuestion() {
    var q = questions[state.index];
    var mount = document.getElementById("question-mount");
    var html = '<p class="q-title">Q' + (state.index + 1) + "</p>";
    html += '<p class="q-text">' + q.text + "</p>";
    html += '<div class="options">';
    q.options.forEach(function (opt, i) {
      html += '<button class="option" type="button" data-i="' + i + '">' + opt.label + "</button>";
    });
    html += "</div>";
    mount.innerHTML = html;

    document.getElementById("q-index").textContent = state.index + 1;
    document.getElementById("progress-fill").style.width = (state.index / questions.length) * 100 + "%";

    var buttons = mount.querySelectorAll(".option");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var opt = q.options[parseInt(btn.getAttribute("data-i"), 10)];
        Object.keys(opt.tags).forEach(function (key) {
          state.scores[key] = (state.scores[key] || 0) + opt.tags[key];
        });
        state.index += 1;
        if (state.index < questions.length) {
          renderQuestion();
        } else {
          document.getElementById("progress-fill").style.width = "100%";
          renderResult();
        }
      });
    });
  }

  function renderResult() {
    var top = toolOrder.slice().sort(function (a, b) { return state.scores[b] - state.scores[a]; })[0];
    var t = tools[top];
    var mount = document.getElementById("result-mount");

    var html = '<span class="result-badge">あなたへのおすすめ</span>';
    html += '<h2 class="result-name">' + t.name + "</h2>";
    html += '<p class="result-tagline">' + t.tagline + "</p>";
    html += '<p class="result-desc">' + t.desc + "</p>";

    html += '<div class="next-step"><h2>使い方のはじめかた</h2><p>' + t.next + "</p></div>";

    html += '<div class="result-actions"><button class="btn-secondary" id="restart-btn" type="button">もう一度診断する</button></div>';

    html += '<p class="footnote">迷ったときの選び方の基準はいつも同じです。<strong>無料または低コストで試せるか／日本語で使えるか／説明書なしでも何となく使えるか。</strong>この3つを満たしていれば、まず試してみて大丈夫です。</p>';

    mount.innerHTML = html;
    show("result");

    document.getElementById("restart-btn").addEventListener("click", function () {
      state = { index: 0, scores: {} };
      toolOrder.forEach(function (k) { state.scores[k] = 0; });
      show("quiz");
      renderQuestion();
    });
  }

  document.getElementById("start-btn").addEventListener("click", function () {
    show("quiz");
    renderQuestion();
  });
})();
</script>
</body>
</html>
