<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI活用スタイル診断</title>
<style>
  :root {
    --paper: #fffaf6;
    --ink: #34172f;
    --ink-soft: #7a5a71;
    --line: #f1d9e4;
    --pink: #ff59a0;
    --magenta: #d81e8f;
    --sky: #2fb8e0;
    --pink-pale: #fce5ed;
    --card: #ffffff;
    --grad: linear-gradient(90deg, var(--pink) 0%, var(--magenta) 52%, var(--sky) 100%);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    overflow-x: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    font-weight: 700;
    text-wrap: balance;
    margin: 0;
    color: var(--ink);
  }

  .page {
    position: relative;
    padding: 48px 20px 64px;
  }

  .deco {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
    opacity: 0.3;
  }
  .deco-a {
    width: 340px;
    height: 340px;
    top: -160px;
    left: -140px;
    background: radial-gradient(circle at 30% 30%, var(--pink), transparent 70%);
  }
  .deco-b {
    width: 300px;
    height: 300px;
    bottom: -140px;
    right: -120px;
    background: radial-gradient(circle at 70% 70%, var(--sky), transparent 70%);
  }
  .deco-arc {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 96px;
    height: 96px;
    opacity: 0.5;
    pointer-events: none;
  }

  .stage {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 18px 48px -24px rgba(52, 23, 47, 0.28);
    padding: 40px clamp(20px, 5vw, 44px) 44px;
  }

  .screen { display: flex; flex-direction: column; gap: 18px; }
  .screen[hidden] { display: none; }

  .eyebrow {
    display: inline-flex;
    align-self: flex-start;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--pink-pale);
    color: var(--magenta);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin: 0;
  }

  h1 { font-size: clamp(26px, 6vw, 32px); }

  .subtitle {
    color: var(--magenta);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    font-weight: 700;
    font-size: 14px;
    margin: -6px 0 0;
    word-break: keep-all;
  }

  .lead {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0;
    max-width: 46ch;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .promise {
    list-style: none;
    margin: 4px 0 0;
    padding: 16px 18px;
    background: var(--pink-pale);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    color: var(--ink);
  }
  .promise strong { color: var(--magenta); font-variant-numeric: tabular-nums; }

  .btn-primary {
    appearance: none;
    border: none;
    cursor: pointer;
    margin-top: 8px;
    padding: 16px 24px;
    border-radius: 999px;
    background: var(--grad);
    color: #fff;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
    box-shadow: 0 12px 24px -12px rgba(216, 30, 143, 0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 16px 28px -12px rgba(216, 30, 143, 0.6); }
  .btn-primary:focus-visible {
    outline: 3px solid var(--sky);
    outline-offset: 3px;
  }

  .btn-secondary {
    appearance: none;
    cursor: pointer;
    margin-top: 4px;
    padding: 12px 22px;
    border-radius: 999px;
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 14px;
  }
  .btn-secondary:hover { border-color: var(--magenta); color: var(--magenta); }
  .btn-secondary:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress-track {
    height: 8px;
    border-radius: 999px;
    background: var(--pink-pale);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--grad);
    transition: width 0.35s ease;
  }
  .progress-label {
    margin: 0;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .q-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--magenta);
    letter-spacing: 0.08em;
    margin: 0 0 2px;
  }
  .q-text {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 19px;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .option {
    appearance: none;
    text-align: left;
    cursor: pointer;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.6;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: var(--pink); background: #fff; }
  .option:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .result-badge {
    align-self: flex-start;
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--grad);
    color: #fff;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .result-name { font-size: clamp(24px, 6vw, 30px); margin-top: 2px; }
  .result-tagline { color: var(--magenta); font-weight: 700; font-size: 14px; margin: 0; }
  .result-desc { color: var(--ink); font-size: 14.5px; margin: 0; }

  .next-step {
    background: var(--pink-pale);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .next-step h2 {
    font-size: 14px;
    color: var(--magenta);
    letter-spacing: 0.02em;
  }
  .next-step p { margin: 0; font-size: 14px; color: var(--ink); }

  .chart { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .chart h2 {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    font-weight: 700;
  }
  .bar-row { display: grid; grid-template-columns: 96px 1fr 34px; align-items: center; gap: 10px; }
  .bar-row .bar-label { font-size: 12.5px; color: var(--ink-soft); }
  .bar-row.is-top .bar-label { color: var(--magenta); font-weight: 700; }
  .bar-track { height: 10px; border-radius: 999px; background: var(--pink-pale); overflow: hidden; }
  .bar-fill { display: block; height: 100%; border-radius: 999px; background: var(--grad); }
  .bar-row .bar-value { font-size: 12px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }

  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

  .footnote {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-primary, .progress-fill, .option { transition: none; }
  }

  @media (max-width: 400px) {
    .bar-row { grid-template-columns: 76px 1fr 30px; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
</head>
<body>

<div class="page">
  <div class="deco deco-a" aria-hidden="true"></div>
  <div class="deco deco-b" aria-hidden="true"></div>
  <svg class="deco-arc" viewBox="0 0 96 96" aria-hidden="true">
    <defs>
      <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff59a0" />
        <stop offset="55%" stop-color="#d81e8f" />
        <stop offset="100%" stop-color="#2fb8e0" />
      </linearGradient>
    </defs>
    <path d="M8,88 A80,80 0 0,1 88,8" fill="none" stroke="url(#arcGrad)" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" />
  </svg>

  <main class="stage" id="stage">
    <section class="screen" data-screen="intro" id="screen-intro">
      <p class="eyebrow">個別相談 参加者限定特典</p>
      <h1>AI活用スタイル診断</h1>
      <p class="subtitle">あなたに合う「AIとの付き合い方」がわかる8問診断</p>
      <p class="lead">8つの質問に答えると、あなたが力を発揮しやすい取り組み方のタイプと、そこから見える次の一歩がわかります。</p>
      <ul class="promise">
        <li>回答時間の目安 <strong>約2分</strong></li>
        <li>質問数 <strong>全8問</strong>・選択式</li>
        <li>結果は <strong>4タイプ</strong> のいずれかで診断されます</li>
      </ul>
      <button class="btn-primary" id="start-btn" type="button">診断をはじめる →</button>
    </section>

    <section class="screen" data-screen="quiz" id="screen-quiz" hidden>
      <div class="progress">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <p class="progress-label"><span id="q-index">1</span> / 8　問</p>
      </div>
      <div id="question-mount"></div>
    </section>

    <section class="screen" data-screen="result" id="screen-result" hidden>
      <div id="result-mount"></div>
    </section>
  </main>
</div>

<script>
(function () {
  var questions = [
    {
      text: "新しいAIツールをすすめられたら、あなたはどうする？",
      options: [
        { t: "shokunin", label: "気に入ったら、使いこなせるまでじっくり触ってみる" },
        { t: "ryosan", label: "とりあえず触ってみて、使いながら覚える" },
        { t: "shireitou", label: "得意な人にコツを聞いて、まねしながら覚える" },
        { t: "chakujitsu", label: "使い方や口コミをひと通り調べてから、使い始める" }
      ]
    },
    {
      text: "家事や仕事の合間に、10分だけ時間ができたら？",
      options: [
        { t: "shokunin", label: "中途半端にせず、まとまった時間にじっくりやる" },
        { t: "ryosan", label: "手を動かして、少しでも先に進めておく" },
        { t: "shireitou", label: "今日やることの順番を、頭の中で整理する" },
        { t: "chakujitsu", label: "気になっていたことを、とりあえず調べる" }
      ]
    },
    {
      text: "「インスタ運用」と聞いて、まずイメージするのは？",
      options: [
        { t: "shokunin", label: "1つのアカウントを、大切に育てるイメージ" },
        { t: "ryosan", label: "複数のアカウントを、同時に動かすイメージ" },
        { t: "shireitou", label: "人にお願いしながら、全体を見るイメージ" },
        { t: "chakujitsu", label: "まず仕組みを理解してから、小さく始めるイメージ" }
      ]
    },
    {
      text: "新しいことを覚えるときのスタイルは？",
      options: [
        { t: "shokunin", label: "気になるところを、深く掘り下げて理解する" },
        { t: "ryosan", label: "とにかく手を動かして、体で覚える" },
        { t: "shireitou", label: "全体の流れをつかんでから、理解する" },
        { t: "chakujitsu", label: "順番通りに、ひとつずつ理解する" }
      ]
    },
    {
      text: "AIに一番手伝ってもらいたいことは？",
      options: [
        { t: "shokunin", label: "仕上げの調整や、細かいクオリティチェック" },
        { t: "ryosan", label: "繰り返しの作業や、量が多いもの" },
        { t: "shireitou", label: "判断すること以外の、実務ほぼすべて" },
        { t: "chakujitsu", label: "まずは簡単なことから、少しずつ" }
      ]
    },
    {
      text: "理想の働き方に近いのは？",
      options: [
        { t: "shokunin", label: "自分のペースで、こだわりを持って働く" },
        { t: "ryosan", label: "効率よく数をこなして、しっかり稼ぐ" },
        { t: "shireitou", label: "複数の案件やタスクを、まとめて管理する" },
        { t: "chakujitsu", label: "無理なく、着実にステップアップする" }
      ]
    },
    {
      text: "周りからよく言われる性格は？",
      options: [
        { t: "shokunin", label: "こだわりが強い、丁寧なところがある" },
        { t: "ryosan", label: "行動力がある、フットワークが軽い" },
        { t: "shireitou", label: "全体を見るのが得意、まとめ役タイプ" },
        { t: "chakujitsu", label: "石橋を叩いて渡る、慎重なタイプ" }
      ]
    },
    {
      text: "新しいツールを選ぶときに、一番気にするのは？",
      options: [
        { t: "shokunin", label: "自分好みに、細かく調整できるか" },
        { t: "ryosan", label: "すぐに結果が出るかどうか" },
        { t: "shireitou", label: "仕組みとして、続けやすいかどうか" },
        { t: "chakujitsu", label: "わかりやすくて、操作がシンプルか" }
      ]
    }
  ];

  var types = {
    shokunin: {
      name: "コツコツ丁寧タイプ",
      tagline: "1つを、じっくり仕上げる",
      desc: "新しいAIツールも、まず自分の手で触って腹落ちさせてから使うタイプ。スピードより仕上がりの丁寧さにこだわるので、AIは「時短の道具」というより「一緒に仕上げる相棒」として使うと本領を発揮します。",
      next: "得意なジャンルを1つ決めて、そのクオリティをじっくり磨き込むところから始めると力を発揮できるタイプです。将来的には「量より質」で選ばれる運用代行者を目指せます。"
    },
    ryosan: {
      name: "とりあえずやってみるタイプ",
      tagline: "数をこなして、感覚をつかむ",
      desc: "考えるよりまず手を動かす行動派。AIを使って作業のスピードと物量を増やすのが得意で、触った回数の多さがそのまま強みになります。",
      next: "AIで時短できた分だけ、対応できる作業量を増やせるタイプ。複数のアカウントや案件を同時に進める運用代行スタイルと相性が良さそうです。"
    },
    shireitou: {
      name: "まかせ上手タイプ",
      tagline: "段取りを組んで、人にも任せる",
      desc: "一つひとつの作業より、全体の流れを組み立てて人やAIに任せるのが得意なタイプ。「誰が・何を・どう進めるか」を考えているときが一番力を発揮できる瞬間です。",
      next: "ゆくゆくは複数のクライアントや複数のAIツールを同時にディレクションする、段取り上手な運用代行スタイルが向いています。"
    },
    chakujitsu: {
      name: "しっかり確認タイプ",
      tagline: "わかってから、着実に進める",
      desc: "いきなり手を広げるより、仕組みや基礎を理解してから動きたい堅実派。焦らず理解してから進める分、一度身につけたスキルは崩れにくいタイプです。",
      next: "まずは1つのAIツール・1つの作業に絞って慣れていくのがおすすめ。土台さえできれば、運用代行のような専門スキルも安心して積み上げられます。"
    }
  };

  var typeOrder = ["shokunin", "ryosan", "shireitou", "chakujitsu"];

  var state = { index: 0, scores: { shokunin: 0, ryosan: 0, shireitou: 0, chakujitsu: 0 } };

  var screens = {
    intro: document.getElementById("screen-intro"),
    quiz: document.getElementById("screen-quiz"),
    result: document.getElementById("screen-result")
  };

  function show(name) {
    Object.keys(screens).forEach(function (key) {
      screens[key].hidden = key !== name;
    });
  }

  function renderQuestion() {
    var q = questions[state.index];
    var mount = document.getElementById("question-mount");
    var html = '<p class="q-title">Q' + (state.index + 1) + "</p>";
    html += '<p class="q-text">' + q.text + "</p>";
    html += '<div class="options">';
    q.options.forEach(function (opt, i) {
      html += '<button class="option" type="button" data-type="' + opt.t + '">' + opt.label + "</button>";
    });
    html += "</div>";
    mount.innerHTML = html;

    document.getElementById("q-index").textContent = state.index + 1;
    document.getElementById("progress-fill").style.width = (state.index / questions.length) * 100 + "%";

    var buttons = mount.querySelectorAll(".option");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.scores[btn.getAttribute("data-type")] += 1;
        state.index += 1;
        if (state.index < questions.length) {
          renderQuestion();
        } else {
          document.getElementById("progress-fill").style.width = "100%";
          renderResult();
        }
      });
    });
  }

  function renderResult() {
    var top = typeOrder.slice().sort(function (a, b) { return state.scores[b] - state.scores[a]; })[0];
    var t = types[top];
    var mount = document.getElementById("result-mount");

    var html = '<span class="result-badge">診断結果</span>';
    html += '<h2 class="result-name">' + t.name + "</h2>";
    html += '<p class="result-tagline">' + t.tagline + "</p>";
    html += '<p class="result-desc">' + t.desc + "</p>";

    html += '<div class="next-step"><h2>次の一歩</h2><p>' + t.next + "</p></div>";

    html += '<div class="chart"><h2>4タイプ スコア内訳</h2>';
    typeOrder.forEach(function (key) {
      var s = state.scores[key];
      var pct = (s / questions.length) * 100;
      var rowClass = key === top ? "bar-row is-top" : "bar-row";
      html += '<div class="' + rowClass + '">';
      html += '<span class="bar-label">' + types[key].name.replace("タイプ", "") + "</span>";
      html += '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>';
      html += '<span class="bar-value">' + s + "/" + questions.length + "</span>";
      html += "</div>";
    });
    html += "</div>";

    html += '<div class="result-actions"><button class="btn-secondary" id="restart-btn" type="button">もう一度診断する</button></div>';

    html += '<p class="footnote">個別相談でお話しした内容と合わせて、次の一歩を考える参考にしてください。</p>';

    mount.innerHTML = html;
    show("result");

    document.getElementById("restart-btn").addEventListener("click", function () {
      state = { index: 0, scores: { shokunin: 0, ryosan: 0, shireitou: 0, chakujitsu: 0 } };
      show("quiz");
      renderQuestion();
    });
  }

  document.getElementById("start-btn").addEventListener("click", function () {
    show("quiz");
    renderQuestion();
  });
})();
</script>
</body>
</html>
