<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIスキル熟練度診断</title>
<style>
  :root {
    --paper: #fffaf6;
    --ink: #34172f;
    --ink-soft: #7a5a71;
    --line: #f1d9e4;
    --pink: #ff59a0;
    --magenta: #d81e8f;
    --sky: #2fb8e0;
    --pink-pale: #fce5ed;
    --card: #ffffff;
    --grad: linear-gradient(90deg, var(--pink) 0%, var(--magenta) 52%, var(--sky) 100%);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    overflow-x: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    font-weight: 700;
    text-wrap: balance;
    margin: 0;
    color: var(--ink);
  }

  .page {
    position: relative;
    padding: 48px 20px 64px;
  }

  .deco {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
    opacity: 0.3;
  }
  .deco-a {
    width: 340px;
    height: 340px;
    top: -160px;
    left: -140px;
    background: radial-gradient(circle at 30% 30%, var(--sky), transparent 70%);
  }
  .deco-b {
    width: 300px;
    height: 300px;
    bottom: -140px;
    right: -120px;
    background: radial-gradient(circle at 70% 70%, var(--pink), transparent 70%);
  }

  .stage {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 18px 48px -24px rgba(52, 23, 47, 0.28);
    padding: 40px clamp(20px, 5vw, 44px) 44px;
  }

  .screen { display: flex; flex-direction: column; gap: 18px; }
  .screen[hidden] { display: none; }

  .eyebrow {
    display: inline-flex;
    align-self: flex-start;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--pink-pale);
    color: var(--magenta);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin: 0;
  }

  h1 { font-size: clamp(26px, 6vw, 32px); }

  .subtitle {
    color: var(--magenta);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    font-weight: 700;
    font-size: 14px;
    margin: -6px 0 0;
    word-break: keep-all;
  }

  .lead {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0;
    max-width: 46ch;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .promise {
    list-style: none;
    margin: 4px 0 0;
    padding: 16px 18px;
    background: var(--pink-pale);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    color: var(--ink);
  }
  .promise strong { color: var(--magenta); font-variant-numeric: tabular-nums; }

  .btn-primary {
    appearance: none;
    border: none;
    cursor: pointer;
    margin-top: 8px;
    padding: 16px 24px;
    border-radius: 999px;
    background: var(--grad);
    color: #fff;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
    box-shadow: 0 12px 24px -12px rgba(216, 30, 143, 0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 16px 28px -12px rgba(216, 30, 143, 0.6); }
  .btn-primary:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

  .btn-secondary {
    appearance: none;
    cursor: pointer;
    margin-top: 4px;
    padding: 12px 22px;
    border-radius: 999px;
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 14px;
  }
  .btn-secondary:hover { border-color: var(--magenta); color: var(--magenta); }
  .btn-secondary:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress-track {
    height: 8px;
    border-radius: 999px;
    background: var(--pink-pale);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--grad);
    transition: width 0.35s ease;
  }
  .progress-label {
    margin: 0;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .q-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--magenta);
    letter-spacing: 0.08em;
    margin: 0 0 2px;
  }
  .q-text {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 19px;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .option {
    appearance: none;
    text-align: left;
    cursor: pointer;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.6;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: var(--pink); background: #fff; }
  .option:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .result-badge {
    align-self: flex-start;
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--grad);
    color: #fff;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .result-name { font-size: clamp(24px, 6vw, 30px); margin-top: 2px; }
  .result-tagline { color: var(--magenta); font-weight: 700; font-size: 14px; margin: 0; }
  .result-desc { color: var(--ink); font-size: 14.5px; margin: 0; }

  .meter {
    background: var(--pink-pale);
    border-radius: 16px;
    padding: 18px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }
  .meter-row { display: flex; align-items: baseline; justify-content: space-between; }
  .meter-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.04em; }
  .meter-score { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700; font-size: 24px; color: var(--magenta); font-variant-numeric: tabular-nums; }
  .meter-score span { font-size: 13px; color: var(--ink-soft); margin-left: 2px; }
  .meter-track { position: relative; height: 12px; border-radius: 999px; background: #fff; overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 999px; background: var(--grad); transition: width 0.4s ease; }
  .meter-zones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 2px; }
  .meter-zone { font-size: 10.5px; text-align: center; color: var(--ink-soft); font-weight: 700; line-height: 1.4; }
  .meter-zone.is-current { color: var(--magenta); }

  .next-step {
    background: var(--pink-pale);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .next-step h2 { font-size: 14px; color: var(--magenta); letter-spacing: 0.02em; }
  .next-step p { margin: 0; font-size: 14px; color: var(--ink); }

  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

  .footnote {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-primary, .progress-fill, .meter-fill, .option { transition: none; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
</head>
<body>

<div class="page">
  <div class="deco deco-a" aria-hidden="true"></div>
  <div class="deco deco-b" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <section class="screen" data-screen="intro" id="screen-intro">
      <p class="eyebrow">個別相談 参加者限定特典</p>
      <h1>AIスキル熟練度診断</h1>
      <p class="subtitle">今のAI活用レベルと、次に伸ばすポイントがわかる8問診断</p>
      <p class="lead">8つの質問に答えると、あなたの今のAI活用度が数値でわかり、次に取り組むと良いポイントが見えてきます。</p>
      <ul class="promise">
        <li>回答時間の目安 <strong>約2分</strong></li>
        <li>質問数 <strong>全8問</strong>・選択式</li>
        <li>結果は <strong>4段階のレベル</strong> で診断されます</li>
      </ul>
      <button class="btn-primary" id="start-btn" type="button">診断をはじめる →</button>
    </section>

    <section class="screen" data-screen="quiz" id="screen-quiz" hidden>
      <div class="progress">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <p class="progress-label"><span id="q-index">1</span> / 8　問</p>
      </div>
      <div id="question-mount"></div>
    </section>

    <section class="screen" data-screen="result" id="screen-result" hidden>
      <div id="result-mount"></div>
    </section>
  </main>
</div>

<script>
(function () {
  var questions = [
    {
      text: "ChatGPTなどのAIチャットツールを使ったことは？",
      options: [
        { label: "まだ使ったことがない", v: 1 },
        { label: "名前は知っているが、あまり触ったことがない", v: 2 },
        { label: "たまに質問したり、調べ物に使っている", v: 3 },
        { label: "毎日のように、いろんな場面で使っている", v: 4 }
      ]
    },
    {
      text: "AIに「指示（プロンプト）」を出すとき、あなたは？",
      options: [
        { label: "何を書けばいいのか、まだよくわからない", v: 1 },
        { label: "とりあえず思いついたことをそのまま聞いている", v: 2 },
        { label: "欲しい答えに近づくように、聞き方を工夫している", v: 3 },
        { label: "目的に合わせて、聞き方をいくつか使い分けている", v: 4 }
      ]
    },
    {
      text: "画像を作るAI（Canva AIや画像生成など）は？",
      options: [
        { label: "存在は知っているが、触ったことがない", v: 1 },
        { label: "一度か二度、試してみたことがある", v: 2 },
        { label: "たまに使って、簡単な画像を作れる", v: 3 },
        { label: "仕上がりを意識して、細かく調整しながら作れる", v: 4 }
      ]
    },
    {
      text: "AIが出した答えが間違っていたら？",
      options: [
        { label: "それが間違っているかどうかも、正直わからない", v: 1 },
        { label: "なんとなく違う気がするけど、確認はしない", v: 2 },
        { label: "気になったら、自分でも調べて確認する", v: 3 },
        { label: "別の聞き方を試したり、他のAIと比べたりする", v: 4 }
      ]
    },
    {
      text: "動画編集アプリのAI機能（字幕・テロップ自動生成など）は？",
      options: [
        { label: "動画編集アプリ自体、ほとんど触ったことがない", v: 1 },
        { label: "基本的な操作は、なんとなくできる", v: 2 },
        { label: "AI機能を、使ったことがある", v: 3 },
        { label: "AI機能を組み合わせて、時短しながら作れる", v: 4 }
      ]
    },
    {
      text: "新しいAIツールが出てきたら？",
      options: [
        { label: "名前を聞いても、正直ピンとこない", v: 1 },
        { label: "気になるけど、なかなか試すところまでいかない", v: 2 },
        { label: "とりあえず触ってみることが多い", v: 3 },
        { label: "自分の作業に使えないか、すぐに試してみる", v: 4 }
      ]
    },
    {
      text: "AIを使うときの気持ちに近いのは？",
      options: [
        { label: "難しそうで、少し身構えてしまう", v: 1 },
        { label: "使ってみたいけど、うまく使えるか不安", v: 2 },
        { label: "慣れてきて、抵抗はあまりない", v: 3 },
        { label: "相棒のような感覚で、気軽に頼っている", v: 4 }
      ]
    },
    {
      text: "今のAIとの付き合い方をひとことで言うと？",
      options: [
        { label: "これから始めるところ", v: 1 },
        { label: "使い始めたばかり", v: 2 },
        { label: "日常や作業に、取り入れられている", v: 3 },
        { label: "手放せない道具に、なっている", v: 4 }
      ]
    }
  ];

  var levels = [
    {
      min: 8, max: 14,
      name: "はじめの一歩タイプ",
      tagline: "ここからで、じゅうぶん間に合う",
      desc: "AIはまだ手探りの段階。難しく考えず、まずは「聞いてみる」ことに慣れるところからで大丈夫です。",
      next: "まずはChatGPTなどに、普段のちょっとした疑問をそのまま聞いてみることから始めてみましょう。「使ったことがある」という経験そのものが、次のステップへの一番の近道になります。"
    },
    {
      min: 15, max: 20,
      name: "伸び盛りタイプ",
      tagline: "使ってはいるが、まだ手探り",
      desc: "AIを使うこと自体には慣れてきたけれど、狙った答えを引き出す「聞き方」にはまだ試行錯誤があるタイプです。",
      next: "同じ質問でも聞き方を変えて試してみると、AIの返す答えが大きく変わることに気づけるはずです。まずは自分なりの「聞き方のパターン」を2〜3個持っておくのがおすすめです。"
    },
    {
      min: 21, max: 26,
      name: "実践者タイプ",
      tagline: "日常のいろんな場面で、使いこなしている",
      desc: "AIをすでに日常や作業の一部として取り入れられているタイプ。聞き方の工夫や、答えの確認も自然にできています。",
      next: "次は「AIに何を任せて、何を自分で判断するか」の線引きを意識してみましょう。任せる範囲を広げるほど、自分の時間を増やしていけます。"
    },
    {
      min: 27, max: 32,
      name: "使いこなしタイプ",
      tagline: "AIが、すっかり相棒になっている",
      desc: "複数のAIツールを場面に応じて使い分け、疑問があれば自分でも検証できる。すでに「使いこなす」段階に入っています。",
      next: "ここからは、自分なりの使い方を「誰かに説明できる形」にしてみるのがおすすめです。言葉にすることで、さらに理解が深まっていきます。"
    }
  ];

  var state = { index: 0, total: 0 };

  var screens = {
    intro: document.getElementById("screen-intro"),
    quiz: document.getElementById("screen-quiz"),
    result: document.getElementById("screen-result")
  };

  function show(name) {
    Object.keys(screens).forEach(function (key) {
      screens[key].hidden = key !== name;
    });
  }

  function renderQuestion() {
    var q = questions[state.index];
    var mount = document.getElementById("question-mount");
    var html = '<p class="q-title">Q' + (state.index + 1) + "</p>";
    html += '<p class="q-text">' + q.text + "</p>";
    html += '<div class="options">';
    q.options.forEach(function (opt) {
      html += '<button class="option" type="button" data-v="' + opt.v + '">' + opt.label + "</button>";
    });
    html += "</div>";
    mount.innerHTML = html;

    document.getElementById("q-index").textContent = state.index + 1;
    document.getElementById("progress-fill").style.width = (state.index / questions.length) * 100 + "%";

    mount.querySelectorAll(".option").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.total += parseInt(btn.getAttribute("data-v"), 10);
        state.index += 1;
        if (state.index < questions.length) {
          renderQuestion();
        } else {
          document.getElementById("progress-fill").style.width = "100%";
          renderResult();
        }
      });
    });
  }

  function renderResult() {
    var min = questions.length * 1;
    var max = questions.length * 4;
    var level = levels.find(function (l) { return state.total >= l.min && state.total <= l.max; }) || levels[levels.length - 1];
    var levelIndex = levels.indexOf(level);
    var pct = Math.round(((state.total - min) / (max - min)) * 100);
    var mount = document.getElementById("result-mount");

    var html = '<span class="result-badge">診断結果</span>';
    html += '<h2 class="result-name">' + level.name + "</h2>";
    html += '<p class="result-tagline">' + level.tagline + "</p>";
    html += '<p class="result-desc">' + level.desc + "</p>";

    html += '<div class="meter">';
    html += '<div class="meter-row"><span class="meter-label">あなたのスコア</span><span class="meter-score">' + state.total + '<span>/' + max + '点</span></span></div>';
    html += '<div class="meter-track"><div class="meter-fill" style="width:' + pct + '%"></div></div>';
    html += '<div class="meter-zones">';
    levels.forEach(function (l, i) {
      html += '<span class="meter-zone' + (i === levelIndex ? " is-current" : "") + '">' + l.name.replace("タイプ", "") + "</span>";
    });
    html += "</div></div>";

    html += '<div class="next-step"><h2>次に伸ばすポイント</h2><p>' + level.next + "</p></div>";

    html += '<div class="result-actions"><button class="btn-secondary" id="restart-btn" type="button">もう一度診断する</button></div>';

    html += '<p class="footnote">個別相談でお話しした内容と合わせて、次に学ぶことを考える参考にしてください。</p>';

    mount.innerHTML = html;
    show("result");

    document.getElementById("restart-btn").addEventListener("click", function () {
      state = { index: 0, total: 0 };
      show("quiz");
      renderQuestion();
    });
  }

  document.getElementById("start-btn").addEventListener("click", function () {
    show("quiz");
    renderQuestion();
  });
})();
</script>
</body>
</html>
