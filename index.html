<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI×SNS診断＆実践スターターキット</title>
<style>
  :root {
    --paper: #fffaf6;
    --ink: #34172f;
    --ink-soft: #7a5a71;
    --line: #f1d9e4;
    --pink: #ff59a0;
    --magenta: #d81e8f;
    --sky: #2fb8e0;
    --pink-pale: #fce5ed;
    --card: #ffffff;
    --grad: linear-gradient(90deg, var(--pink) 0%, var(--magenta) 52%, var(--sky) 100%);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    overflow-x: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    font-weight: 700;
    text-wrap: balance;
    margin: 0;
    color: var(--ink);
  }

  .page { position: relative; padding: 40px 16px 72px; }

  .deco {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
    opacity: 0.3;
  }
  .deco-a { width: 320px; height: 320px; top: -150px; left: -130px; background: radial-gradient(circle at 30% 30%, var(--pink), transparent 70%); }
  .deco-b { width: 300px; height: 300px; bottom: -130px; right: -110px; background: radial-gradient(circle at 70% 70%, var(--sky), transparent 70%); }

  .wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; position: relative; }

  .eyebrow {
    display: inline-flex;
    align-self: flex-start;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--pink-pale);
    color: var(--magenta);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  header.hero {
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 18px 48px -28px rgba(52, 23, 47, 0.28);
    padding: 32px clamp(18px, 5vw, 36px) 30px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h1 { font-size: clamp(24px, 6.4vw, 32px); }
  .lead { color: var(--ink-soft); font-size: 14px; margin: 0; max-width: 46ch; word-break: keep-all; overflow-wrap: anywhere; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .pill { font-size: 12px; font-weight: 700; color: var(--magenta); background: var(--pink-pale); border-radius: 999px; padding: 6px 12px; }

  .section-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    padding: 4px 4px 0;
  }

  .kit-list { display: flex; flex-direction: column; gap: 14px; }

  .kit-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border-radius: 22px;
    padding: 18px clamp(16px, 4vw, 22px);
    box-shadow: 0 16px 36px -26px rgba(52, 23, 47, 0.3);
    text-decoration: none;
    color: inherit;
    border: 1.5px solid transparent;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .kit-item:hover { border-color: var(--pink); transform: translateY(-2px); }

  .kit-badge {
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 16px;
    background: var(--grad);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .kit-body { flex: 1; min-width: 0; }
  .kit-num { font-size: 11px; font-weight: 700; color: var(--magenta); letter-spacing: 0.06em; margin: 0 0 2px; }
  .kit-title { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 4px; }
  .kit-desc { font-size: 12.5px; color: var(--ink-soft); margin: 0; word-break: keep-all; overflow-wrap: anywhere; }

  .kit-arrow {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--pink-pale);
    color: var(--magenta);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
  }

  .footnote { font-size: 11.5px; color: var(--ink-soft); text-align: center; padding: 4px 8px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
</head>
<body>

<div class="page">
  <div class="deco deco-a" aria-hidden="true"></div>
  <div class="deco deco-b" aria-hidden="true"></div>

  <div class="wrap">
    <header class="hero">
      <span class="eyebrow">個別相談 参加者限定特典</span>
      <h1>AI×SNS診断＆実践スターターキット</h1>
      <p class="lead">今日話した内容を、ここで行動に変えていきましょう。5つとも、好きな順番で・何度でも見返してOKです。</p>
      <div class="pills">
        <span class="pill">全5点</span>
        <span class="pill">好きな順番でOK</span>
        <span class="pill">何度でも見返せる</span>
      </div>
    </header>

    <p class="section-label">SET CONTENTS</p>

    <div class="kit-list" id="kitList"></div>

    <p class="footnote">気になるものから、ひとつずつ開いてみてください。</p>
  </div>
</div>

<script>
(function () {
  var items = [
    {
      icon: "📝",
      title: "行動に変えるシート",
      desc: "今日決めたことを、行動に変える",
      url: "next-step-sheet.html"
    },
    {
      icon: "🔮",
      title: "AI活用スタイル診断チャート",
      desc: "あなたに合う「AIとの付き合い方」がわかる8問診断",
      url: "ai-style-diagnosis.html"
    },
    {
      icon: "📶",
      title: "AIスキル熟練度診断チャート",
      desc: "今のAI活用レベルと、次に伸ばすポイントがわかる8問診断",
      url: "ai-skill-diagnosis.html"
    },
    {
      icon: "✅",
      title: "AIツールの選び方",
      desc: "流行に左右されない、普遍の5基準チェックリスト",
      url: "ai-tool-checklist.html"
    },
    {
      icon: "🧭",
      title: "運用代行スタート準備チェックリスト",
      desc: "未経験から、案件応募までの6ステップ",
      url: "unyou-daikou-checklist.html"
    }
  ];

  var mount = document.getElementById("kitList");
  var html = "";
  items.forEach(function (item, i) {
    html += '<a class="kit-item" href="' + item.url + '" target="_blank" rel="noopener">';
    html += '<span class="kit-badge">' + item.icon + "</span>";
    html += '<span class="kit-body"><p class="kit-num">ITEM ' + (i + 1) + '</p><p class="kit-title">' + item.title + '</p><p class="kit-desc">' + item.desc + "</p></span>";
    html += '<span class="kit-arrow">&#8594;</span>';
    html += "</a>";
  });
  mount.innerHTML = html;
})();
</script>
</body>
</html>
